<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Textile ERP</title>
<style>
  :root{
    --navy:#0f172a; --navy2:#1e293b; --accent:#2563eb; --bg:#f1f5f9; --card:#ffffff;
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --ok:#16a34a; --bad:#dc2626; --warn:#d97706;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px}
  #root{height:100%}
  .app{display:flex; min-height:100vh}
  .sidebar{width:230px; background:var(--navy); color:#cbd5e1; display:flex; flex-direction:column;
    position:fixed; top:0; bottom:0; left:0}
  .brand{padding:20px 18px; font-weight:700; color:#fff; font-size:16px; letter-spacing:.3px;
    border-bottom:1px solid #1e293b}
  .brand small{display:block; color:#64748b; font-weight:500; font-size:11px; margin-top:3px}
  .nav{padding:10px 8px; overflow:auto}
  .nav button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0;
    background:transparent; color:#cbd5e1; padding:10px 12px; border-radius:8px; cursor:pointer; font-size:13.5px}
  .nav button:hover{background:#1e293b; color:#fff}
  .nav button.active{background:var(--accent); color:#fff}
  .nav .group{color:#475569; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; padding:14px 12px 4px}
  .main{margin-left:230px; flex:1; display:flex; flex-direction:column; min-width:0}
  .topbar{background:#fff; border-bottom:1px solid var(--line); padding:14px 24px; display:flex;
    justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5}
  .topbar h1{font-size:17px; margin:0}
  .topbar .who{color:var(--muted); font-size:12.5px}
  .content{padding:24px; max-width:1200px}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px; margin-bottom:22px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
    box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .card .label{color:var(--muted); font-size:12px; margin-bottom:8px}
  .card .value{font-size:22px; font-weight:700}
  .card .value.pos{color:var(--ok)} .card .value.neg{color:var(--bad)}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:22px}
  .panel h3{margin:0 0 14px; font-size:14px}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  .badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600}
  .badge.ok{background:#dcfce7; color:#166534} .badge.bad{background:#fee2e2; color:#991b1b}
  .badge.warn{background:#fef3c7; color:#92400e}
  input,select{padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff}
  button.btn{background:var(--accent); color:#fff; border:0; padding:9px 16px; border-radius:8px;
    cursor:pointer; font-size:13px; font-weight:600}
  button.btn.sec{background:#e2e8f0; color:#0f172a}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:end}
  .field{display:flex; flex-direction:column; gap:5px} .field label{font-size:11.5px; color:var(--muted)}
  .login{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy)}
  .login .box{background:#fff; padding:34px; border-radius:16px; width:330px; box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .login h2{margin:0 0 4px} .login p{margin:0 0 20px; color:var(--muted); font-size:13px}
  .login .field{margin-bottom:14px} .login input{width:100%}
  .err{color:var(--bad); font-size:12.5px; margin-top:8px}
  .muted{color:var(--muted)} .mb{margin-bottom:16px}
  .chartbox{width:100%; height:260px}
</style>
</head>
<body>
<div id="root"></div>

<!-- Libraries are vendored locally (see vendor/) so the UI has no runtime CDN
     dependency. The app is precompiled from app.src.jsx to app.js (build-ui.sh). -->
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/prop-types.js"></script>
<script src="vendor/recharts.js"></script>
<script src="app.js"></script>
</body>
</html>
