# Textile ERP - development stack: PostgreSQL + FastAPI backend.
# Usage:  cp backend/.env.example backend/.env && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Override host for in-network access to the db service.
      DATABASE_URL: postgresql+psycopg2://erp:erp@db:5432/erp
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  erp_pgdata:
