<script>
(function () {
  var PHONE = "918360180643";
  var text = new URLSearchParams(location.search).get("text") || "";
  var dest = "https://wa.me/" + PHONE + (text ? "?text=" + encodeURIComponent(text) : "");

  document.getElementById("go").href = dest;

  /* This page exists so the click registers as a pageview in Cloudflare Web
     Analytics, which has no custom-event API. Hold just long enough for the
     edge-injected beacon to report, then forward — polling for the RUM call
     so a fast beacon means a fast redirect, with a hard cap either way. */
  var sent = false;
  function go() { if (!sent) { sent = true; location.replace(dest); } }

  function reported() {
    try {
      return performance.getEntriesByType("resource").some(function (r) {
        return /cloudflareinsights\.com/.test(r.name) && r.responseEnd > 0;
      });
    } catch (e) { return false; }
  }

  var waited = 0;
  var poll = setInterval(function () {
    waited += 100;
    if (reported() || waited >= 1600) { clearInterval(poll); setTimeout(go, 120); }
  }, 100);

  setTimeout(go, 2500);   // last-resort cap
})();
</script>
